<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Chaiti Das</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #faf9f7;
      padding: 20px;
    }
    .thankyou-container {
      background: #ffffff;
      padding: 4rem 3rem;
      border-radius: 28px;
      text-align: center;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.06);
      animation: fadeInUp 0.6s ease;
      border: 1px solid rgba(124,107,155,0.08);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .success-icon {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #7c6b9b, #b9a5d4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      animation: popIn 0.5s ease 0.3s both;
    }
    @keyframes popIn {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .success-icon i { font-size: 3.5rem; color: #fff; }
    .thankyou-container h1 { font-size: 2.4rem; font-weight: 700; color: #2e2b3c; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1.05rem; color: #7c6b9b; font-weight: 500; margin-bottom: 1rem; }
    .message { font-size: 1rem; color: #6b6578; line-height: 1.8; margin-bottom: 2rem; }
    .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 12px 28px; border-radius: 60px;
      font-weight: 600; font-size: 0.95rem; text-decoration: none;
      transition: all 0.3s ease; cursor: pointer; border: none;
    }
    .btn-primary {
      background: #7c6b9b; color: #fff;
      box-shadow: 0 8px 20px rgba(124,107,155,0.25);
    }
    .btn-primary:hover { transform: translateY(-3px); background: #6a5a87; }
    .btn-secondary {
      background: transparent; color: #7c6b9b;
      border: 2px solid #7c6b9b;
    }
    .btn-secondary:hover { background: #7c6b9b; color: #fff; transform: translateY(-3px); }
    .social-share { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #f0eeea; }
    .social-share p { font-size: 0.9rem; color: #9b94a8; margin-bottom: 0.8rem; }
    .social-share a {
      display: inline-flex; width: 44px; height: 44px;
      border-radius: 50%; background: #f3f0ee;
      align-items: center; justify-content: center;
      color: #2e2b3c; font-size: 1.15rem;
      transition: all 0.3s ease; margin: 0 0.3rem;
    }
    .social-share a:hover { background: #7c6b9b; color: #fff; transform: translateY(-5px); }
    @media (max-width: 480px) {
      .thankyou-container { padding: 2.5rem 1.5rem; }
      .thankyou-container h1 { font-size: 1.9rem; }
      .success-icon { width: 80px; height: 80px; }
      .success-icon i { font-size: 2.6rem; }
      .btn-group { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="thankyou-container">
    <div class="success-icon"><i class="fa-solid fa-check"></i></div>
    <h1>Thank You! 🙏</h1>
    <p class="subtitle">Your message has been sent successfully</p>
    <p class="message">
      I appreciate you reaching out. I'll review your message and get back to you soon.<br><br>Have a great day! 🌟
    </p>
    <div class="btn-group">
      <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
      <a href="index.html#contact" class="btn btn-secondary"><i class="fa-regular fa-envelope"></i> Send Another</a>
    </div>
    <div class="social-share">
      <p>Connect with me</p>
      <div>
        <a href="https://github.com/dchaity" target="_blank"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/chaity-das-682bb32a3" target="_blank"><i class="fab fa-linkedin-in"></i></a>
        <a href="mailto:dchaity240@gmail.com"><i class="fa-regular fa-envelope"></i></a>
      </div>
    </div>
  </div>
</body>
</html>
